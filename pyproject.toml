[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightlog"
version = "0.1.0"
description = "Flight test reports from ArduPilot DataFlash logs: attitude step response, navigation tracking, VTOL transitions and health checks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jordan McKenzie" }]
requires-python = ">=3.10"
dependencies = ["pymavlink>=2.4.40", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
flightlog-report = "flightlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
